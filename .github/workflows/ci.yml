name: Flutter CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meal_planner

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos lib test

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: meal_planner/coverage/lcov.info
          if-no-files-found: warn

      # Floor measured 2026-08-13 after logic tests: 8.72% → 8.
      # Excludes UI, generated l10n, and firebase_options.
      - name: Check coverage floor
        uses: VeryGoodOpenSource/very_good_coverage@v3
        with:
          path: meal_planner/coverage/lcov.info
          min_coverage: 8
          exclude: >-
            **/*.g.dart
            **/*_localizations*.dart
            **/l10n/**
            **/firebase_options.dart
            **/presentation/**
            **/widgets/**
