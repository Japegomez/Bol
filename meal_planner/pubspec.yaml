name: meal_planner
description: MealPlanner — plan your weekly meals and generate shopping lists.
publish_to: "none"
version: 1.3.0+12

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  supabase_flutter: ^2.17.1
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  sentry_flutter: ^9.26.0
  firebase_core: ^4.13.0
  firebase_analytics: ^12.4.6
  logger: ^2.5.0
  flutter_secure_storage: ^9.2.4
  connectivity_plus: ^7.3.1
  upgrader: ^13.6.0
  in_app_review: ^2.0.10
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.6
  image_picker: ^1.2.3
  speech_to_text: ^7.3.0
  share_plus: ^12.0.2
  app_links: ^7.2.1
  cached_network_image: ^3.4.1
  flutter_slidable: ^4.0.3
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.13.0
  web: ^1.1.0
  url_launcher: ^6.3.1
  shared_preferences: ^2.5.5
  drift: ^2.34.3
  sqlite3: ^3.0.0
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.6.0
  flutter_local_notifications: ^18.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  supadart: ^1.9.3
  flutter_launcher_icons: ^0.14.3
  drift_dev: ^2.34.5
  build_runner: ^2.4.15

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon_1024.png
  adaptive_icon_background: "#F5F0E8"
  adaptive_icon_foreground: assets/branding/app_icon_1024.png
  remove_alpha_ios: true

flutter:
  generate: true
  uses-material-design: true

# Bundle SQLite3MultipleCiphers (SQLCipher-compatible) so the local drift
# database can be encrypted with PRAGMA key. Replaces the legacy
# sqlite3_flutter_libs dependency.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
