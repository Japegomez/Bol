<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Böl</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f3ee;
        --ink: #1f1a17;
        --accent: #2f6f5e;
        --muted: #6b635c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", system-ui, sans-serif;
        background:
          radial-gradient(circle at top left, #e8f2ee, transparent 40%),
          linear-gradient(180deg, #fbf8f3 0%, var(--bg) 100%);
        color: var(--ink);
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(420px, 100%);
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 2rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
        line-height: 1.5;
      }
      a.button {
        display: inline-block;
        background: var(--accent);
        color: white;
        text-decoration: none;
        padding: 14px 22px;
        border-radius: 12px;
        font-weight: 600;
      }
      .hint {
        margin-top: 18px;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Böl</h1>
      <p id="message">Instala Böl para abrir este enlace.</p>
      <a
        class="button"
        id="install"
        href="https://play.google.com/store/apps/details?id=com.japegomez.meal_planner"
      >Instalar la app</a>
      <p class="hint">
        Si no tienes la app instalada, instálala y vuelve a abrir este enlace.
      </p>
    </main>
    <script>
      (function () {
        var path = window.location.pathname || "/";
        var message = document.getElementById("message");

        if (/^\/h\//.test(path)) {
          message.textContent = "Únete a un hogar en Böl. Instala la app y vuelve a abrir este enlace.";
        } else if (/^\/(r|p)\//.test(path)) {
          message.textContent = "Abre esta receta en Böl. Instala la app y vuelve a abrir este enlace.";
        } else {
          message.textContent = "Comparte y abre recetas en Böl.";
        }
      })();
    </script>
  </body>
</html>
